data:
  processed_dir: data/processed
  train_start: "2007-01-01"
  train_end: "2017-12-31"
  val_start: "2018-01-01"
  val_end: "2018-12-31"
  test_start: "2019-01-01"
  test_end: "2026-03-26"
  sequence_length: 20

model:
  num_features: 20
  hidden_dim: 20
  num_factors: 8
  num_portfolios: 16
  leaky_relu_slope: 0.1

training:
  # Nota: o DataLoader sempre usa batch_size=1 (uma cross-section por step).
  # A "batch" efetiva do modelo é N_s (número de tickers na data s), que varia.
  max_epochs: 50
  learning_rate: 3.0e-4
  gamma: 1.0
  seed: 8
  sigma_floor: 1.0e-6
  kl_warmup_steps: 500    # linear ramp gamma 0→1 over this many optimizer steps
  kl_free_bits: 0.0        # minimum nats per factor; 0 = no clamping
  weight_decay: 1.0e-4    # L2 regularisation on all parameters

evaluation:
  top_k: 50
  drop_n: 5
  risk_aversion_eta: 1.0
  risk_free_rate: 0.10   # taxa livre de risco anual (CDI proxy) para Sharpe
